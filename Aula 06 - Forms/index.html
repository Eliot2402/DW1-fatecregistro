<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMULARIOS</title>
  </head>
  <body>
    <h1>formularios no html5</h1>
    <form action="/cadastrar" method="post">
      <label for="nome">insira seu nome:</label><br />
      <!-- input de texto -->
      <input type="text" id="nome" placeholder="Ex: João" /><br />
      <!-- input de e-mail -->
       <label for="email">Insira seu email</label><br>
      <input type="email" id="email" placeholder="Ex: João@gmail.com"/><br />
      <!-- input de senha -->
       <label for="senha">Insira sua senha</label><br>
      <input type="password" id="senha" placeholder="Ex:1234" />
    </form>
  </body>
</html>
